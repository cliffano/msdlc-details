[build-system]
requires = [ "poetry-core" ]
build-backend = "poetry.core.masonry.api"

[installer]
no-binary = [ ":none:" ]

[tool.poetry]
name = "msdlcdetails"
version = "0.9.0-pre.0"
description = "Micro library for retrieving Microsoft Download Center page details"
license = "Apache-2.0"
authors = [ "Cliffano Subagio <cliffano@gmail.com>" ]
readme = "README.md"
homepage = "https://github.com/cliffano/msdlc-details"
repository = "https://github.com/cliffano/msdlc-details"
documentation = "https://github.com/cliffano/msdlc-details"
keywords = [ "msdlcdetails", "microsoft", "download-center", "download" ]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

[[tool.poetry.packages]]
include = "msdlcdetails"

[tool.poetry.dependencies]
python = "^3.12"
conflog = "~2.1.2"

[tool.poetry.group.dev.dependencies]
black = "~26.10.1"
twine = "~7.0.0"
wheel = "~0.48.0"

[tool.poetry.group.test.dependencies]
bandit = "~1.9.4"
coverage = "~7.17.2"
numpy = "1.26.4" # https://stackoverflow.com/questions/78634235/numpy-dtype-size-changed-may-indicate-binary-incompatibility-expected-96-from
pylint = "~4.1.3"
pytest = "~9.2.0"
radon = "~6.0.1"

[tool.poetry.group.doc.dependencies]
ansi2html = "~1.9.5"
pylint-report = "~2.4.2"
pytest-html = "~4.2.0"
Sphinx = "9.1.1" # Pinned for Python 3.12 support